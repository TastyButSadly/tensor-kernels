name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch and development tools
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest ruff setuptools wheel

      - name: Lint
        run: python -m ruff check .

      - name: Build wheel
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel
        run: python -m pip install --no-deps dist/moe_topk-*.whl

      - name: Test installed wheel outside the source tree
        run: |
          temp_dir="$(mktemp -d)"
          cp -R tests "$temp_dir/tests"
          cd "$temp_dir"
          python -m pytest -q tests
